<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Table template</title>
    <link href="styles/minimal-table.css" rel="stylesheet" type="text/css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home page</a></li>
            <li><a href="landing-page/index.html">Landing page</a></li>
            <li><a href="flexbox-and-gridbox-test.html">Flex page</a></li>
        </ul>
    </nav>
    
    <h1>Table template</h1>
    <table>
        <tr>
            <th>Name</th>
            <td>John.</td>
            <td>Jack.</td>
        </tr>
            <th>Age</th>
            <td>20</td>
            <td>40</td>
        <tr>
    </table>

    <h1>Pets table</h1>
    <table>
        <tr>
            <th colspan="2">Animals</th>
        </tr>
        <tr>
            <th colspan="2">Hippopotamus</th>
        </tr>
        <tr>
            <th rowspan="2">Horse</th>
            <td>Mare</td>
        </tr>
        <tr>
            <td>Stallion</td>
        </tr>
        <tr>
            <th colspan="2">Crocodile</th>
        </tr>
        <tr>
            <th rowspan="2">Chicken</th>
            <td>Hen</td>
        </tr>
        <tr>
            <td>Rooster</td>
        </tr>
    </table>


</body>
</html>
